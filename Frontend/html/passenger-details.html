<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudBus | Passenger Details</title>

   <link rel="stylesheet" href="../css/passenger-details.css">
</head>
<body>

<header>

    <div class="logo">
        🚌 CloudBus
    </div>

</header>

<main class="container">

    <div class="card">

        <h1>Passenger Details</h1>

        <div class="trip-summary">

            <div>
                <span>Selected Seats</span>
                <h3 id="seatNumbers">-</h3>
            </div>

            <div>
                <span>Total Fare</span>
                <h2>₹<span id="totalFare">0</span></h2>
            </div>

        </div>

        <form id="passengerForm">

            <div class="grid">

                <div class="input-group">
                    <label>Full Name *</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter Full Name"
                        required>
                </div>

                <div class="input-group">
                    <label>Age *</label>
                    <input
                        type="number"
                        id="age"
                        min="1"
                        max="120"
                        placeholder="Age"
                        required>
                </div>

                <div class="input-group">
                    <label>Gender *</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Mobile Number *</label>
                    <input
                        type="tel"
                        id="mobile"
                        maxlength="10"
                        placeholder="10 Digit Mobile Number"
                        required>
                </div>

                <div class="input-group">
                    <label>Email *</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required>
                </div>

                <div class="input-group">
                    <label>Emergency Contact (Optional)</label>
                    <input
                        type="tel"
                        id="emergency"
                        maxlength="10"
                        placeholder="Emergency Contact">
                </div>

            </div>

            <button type="submit">
                Proceed to Payment
            </button>

        </form>

    </div>

</main>

<script src="../js/passenger-details.js"></script>

</body>
</html>
