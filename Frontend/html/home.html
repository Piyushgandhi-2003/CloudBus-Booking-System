<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudBus | Home</title>

<link rel="stylesheet" href="../css/home.css">

</head>

<body>

<nav>

<div class="logo">
<div class="logo-circle">🚌</div>
<h2>CloudBus</h2>
</div>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Routes</a></li>
<li><a href="#">Bookings</a></li>
<li><a href="#">Contact</a></li>
</ul>

</nav>

<section class="hero">

<div class="search-card">

<h1>Book Your Bus Ticket</h1>

<p>Search buses across your favorite destinations.</p>

<div class="form-grid">

<div class="input-group">
<label>Source</label>
<input type="text" id="source" placeholder="Enter Source City">
</div>

<div class="input-group">
<label>Destination</label>
<input type="text" id="destination" placeholder="Enter Destination City">
</div>

<div class="input-group">
<label>Travel Date</label>
<input type="date" id="travelDate">
</div>

</div>

<div class="button-area">
<button onclick="searchBus()">Search Bus</button>
</div>

<div id="message"></div>

</div>

</section>

</footer>
